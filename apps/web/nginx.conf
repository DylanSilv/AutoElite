server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # La API va por el mismo origen: así la cookie httpOnly del refresh token
  # viaja sin depender de CORS ni de SameSite=None.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:3000/health;
  }

  # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier ruta desconocida la resuelve el router del panel.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
